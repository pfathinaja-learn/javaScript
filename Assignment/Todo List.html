<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .todo-container {
            background: white;
            width: 400px;
            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }

        #taskInput:focus {
            outline: none;
            border-color: #04AA6D;
        }

        .add-btn {
            padding: 12px 18px;

            border: none;
            border-radius: 6px;

            background: #04AA6D;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #038f5c;
        }

        #taskList {
            margin-top: 25px;
            list-style: none;
        }

        #taskList li {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #f8f9fa;

            padding: 12px 15px;

            margin-bottom: 10px;

            border-radius: 6px;

            border: 1px solid #e5e5e5;

            color: #333;
        }

        .delete-btn {
            background: #dc3545;
            color: white;

            border: none;
            border-radius: 5px;

            padding: 7px 12px;

            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b02a37;
        }
    </style>
</head>

<body>

    <div class="todo-container">

        <h1>Todo List</h1>

        <div class="input-container">

            <input type="text" placeholder="Enter task..." id="taskInput">

            <button class="add-btn" onclick="addTask()">
                Add
            </button>

        </div>

        <ul id="taskList"></ul>

    </div>


    <script>

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];


        function renderTask() {

            let list = document.getElementById("taskList");

            list.innerHTML = "";

            tasks.forEach((task, index) => {

                let li = document.createElement("li");

                li.innerHTML = `
                    ${task}

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${index})">
                        Delete
                    </button>
                `;

                list.appendChild(li);

            });
        }


        function addTask() {

            let input = document.getElementById("taskInput");

            if (input.value === "") return;

            tasks.push(input.value);

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

            input.value = "";

            renderTask();
        }


        function deleteTask(index) {

            tasks.splice(index, 1);

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

            renderTask();
        }


        renderTask();

    </script>
